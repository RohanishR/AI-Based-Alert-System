model_path: "yolov8n.pt"        # Default COCO pretrained model
confidence_threshold: 0.15       # Lowered for aerial/drone footage where vehicles appear small
input_size: 1280                 # Increased from 640 to detect smaller objects in aerial views

# Target classes we want to detect
target_classes:
  - "car"
  - "motorcycle"
  - "auto_rickshaw"
  - "bus"
  - "truck"
  - "bicycle"
  - "pedestrian"

# Class mapping: map COCO class IDs to standardized names.
# Swap this section entirely when using a fine-tuned Indian traffic model.
class_mapping:
  0: "pedestrian"   # COCO 'person'
  1: "bicycle"
  2: "car"
  3: "motorcycle"
  5: "bus"
  7: "truck"
  # Custom classes for fine-tuned models:
  # 8: "auto_rickshaw"
