model_path: "yolov8n.pt" # Default COCO pretrained model
confidence_threshold: 0.4

# Target classes we want to detect
target_classes:
  - "car"
  - "motorcycle"
  - "auto_rickshaw"
  - "bus"
  - "truck"
  - "bicycle"
  - "pedestrian"

# Class mapping: map model class IDs to standardized string names.
# This makes it easy to swap between COCO and a fine-tuned Indian dataset model later.
class_mapping:
  # Standard COCO IDs
  0: "pedestrian"  # Mapped from 'person'
  1: "bicycle"
  2: "car"
  3: "motorcycle"
  5: "bus"
  7: "truck"
  # Custom classes for fine-tuned models can be added below
  # e.g., 8: "auto_rickshaw"
