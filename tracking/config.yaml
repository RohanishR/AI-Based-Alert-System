# ByteTrack configuration
track_thresh: 0.3               # Minimum confidence to start a NEW track
match_thresh: 0.85              # IoU matching threshold (higher = stricter match)
max_age: 50                     # Frames to keep a lost track alive (higher = survives occlusion better)
history_length: 15              # Number of historical centroid positions to keep
minimum_consecutive_frames: 3   # Require N consecutive detections before confirming a track
